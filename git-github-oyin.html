<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Git va GitHub poygasi</title>
<style>
  :root {
    --bg: #eef2f8;
    --ink: #14213d;
    --muted: #5b6475;
    --card: #ffffff;
    --line: #d6dce8;
    --ok: #1f9d55;
    --bad: #d64545;
    --accent: #2b6cb0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation; overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  input, textarea, select { font: inherit; color: inherit; user-select: text; -webkit-user-select: text; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: flex; }

  /* ---------- SETTINGS ---------- */
  #settings, #admin { align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px; }
  .panel { background: var(--card); border-radius: 28px; box-shadow: 0 12px 40px rgba(20,33,61,.12); padding: 36px 44px; width: min(1200px, 100%); }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 26px; flex-wrap: wrap; }
  .brand h1 { margin: 0; font-size: 46px; line-height: 1.1; }
  .brand h1 span { color: var(--accent); }
  .seg { display: inline-flex; background: #e6ebf3; border-radius: 18px; padding: 6px; gap: 6px; }
  .seg button { border: none; background: transparent; border-radius: 14px; min-height: 64px; min-width: 120px; padding: 0 22px; font-size: 24px; font-weight: 700; color: var(--muted); }
  .seg button.sel { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 36px; }
  .field { background: #f6f8fc; border: 2px solid var(--line); border-radius: 22px; padding: 18px 22px; }
  .field .lbl { font-size: 22px; font-weight: 700; color: var(--muted); margin-bottom: 12px; }
  .field .hint { font-size: 18px; color: var(--muted); margin-top: 8px; }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .stepper button { width: 88px; height: 88px; border-radius: 22px; border: none; background: var(--accent); color: #fff; font-size: 48px; font-weight: 700; line-height: 1; }
  .stepper button:active { transform: scale(.95); }
  .stepper button:disabled { background: #b8c2d3; }
  .stepper .val { font-size: 64px; font-weight: 800; min-width: 90px; text-align: center; }
  .rules { margin: 22px 0 0; padding: 18px 22px; border-radius: 20px; background: #fff8e6; border: 2px solid #f1d58a; font-size: 21px; line-height: 1.5; }
  .rules b { display: block; margin-bottom: 4px; }
  .rules ol { margin: 0; padding-left: 26px; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 26px; flex-wrap: wrap; }
  .total { font-size: 24px; color: var(--muted); font-weight: 600; }
  .big { min-height: 96px; padding: 0 56px; border: none; border-radius: 26px; background: var(--ok); color: #fff; font-size: 34px; font-weight: 800; box-shadow: 0 6px 0 #157a40; }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #157a40; }
  .btn3 { min-height: 72px; padding: 0 28px; border-radius: 20px; border: 3px solid var(--line); background: #fff; font-size: 24px; font-weight: 800; }
  .btn3.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn3.red { background: #fff; border-color: var(--bad); color: var(--bad); }
  .btn3:active { transform: scale(.97); }
  .btn3:disabled { opacity: .45; }

  /* o'quvchilar */
  .students { display: grid; grid-template-columns: 1fr 1.6fr; gap: 22px; }
  .students textarea { width: 100%; min-height: 300px; resize: vertical; border-radius: 18px; border: 3px solid var(--line); padding: 14px 18px; font-size: 22px; line-height: 1.45; }
  .students textarea:focus, .tcard input:focus, .ed input:focus, .ed select:focus { outline: none; border-color: var(--accent); }
  .srow { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .scount { font-size: 20px; font-weight: 700; color: var(--muted); }
  .tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; align-content: start; }
  .tcard { border: 3px solid var(--c); border-radius: 18px; overflow: hidden; background: #fff; }
  .tcard input { width: 100%; min-height: 60px; border: none; border-bottom: 3px solid var(--c); background: color-mix(in srgb, var(--c) 12%, white); padding: 0 14px; font-size: 22px; font-weight: 800; }
  .tcard .mem { padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 52px; }
  .chip { background: #eef2f8; border-radius: 999px; padding: 4px 12px; font-size: 18px; font-weight: 700; }
  .tcard .empty { color: var(--muted); font-size: 17px; }

  /* ---------- ADMIN ---------- */
  .atop { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .atop h1 { margin: 0 auto 0 0; font-size: 40px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters button { min-height: 56px; padding: 0 20px; border-radius: 999px; border: 3px solid var(--line); background: #fff; font-size: 20px; font-weight: 800; color: var(--muted); }
  .filters button.sel { border-color: var(--accent); background: var(--accent); color: #fff; }
  .qlist { display: flex; flex-direction: column; gap: 10px; }
  .qitem { display: grid; grid-template-columns: 54px 1fr auto; gap: 14px; align-items: center; border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; background: #fbfcfe; }
  .qitem .num { font-size: 22px; font-weight: 800; color: var(--muted); text-align: center; }
  .qitem .qt { font-size: 22px; font-weight: 700; line-height: 1.3; }
  .qitem .qs { font-size: 17px; color: var(--muted); margin-top: 4px; }
  .qitem .tp { display: inline-block; font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; border-radius: 999px; padding: 2px 10px; margin-right: 8px; background: #e6ebf3; color: var(--muted); }
  .qitem .acts { display: flex; gap: 8px; }
  .qitem .acts button { min-height: 60px; min-width: 60px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--line); background: #fff; font-size: 20px; font-weight: 800; }
  .qitem .acts .d { border-color: #f0b0b0; color: var(--bad); }
  .box.ed { text-align: left; }
  .ed h2 { text-align: center; }
  .ed .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ed label.l { display: block; font-size: 19px; font-weight: 800; color: var(--muted); margin: 14px 0 6px; }
  .ed input[type=text], .ed select { width: 100%; min-height: 60px; border-radius: 14px; border: 3px solid var(--line); padding: 0 14px; font-size: 21px; background: #fff; }
  .ed .ans { display: grid; grid-template-columns: 70px 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
  .ed .ans.o { grid-template-columns: 50px 1fr 1fr; }
  .ed .rad { width: 64px; height: 60px; border-radius: 14px; border: 3px solid var(--line); background: #fff; font-size: 28px; font-weight: 900; color: #c2c9d6; }
  .ed .rad.sel { background: var(--ok); border-color: var(--ok); color: #fff; }
  .ed .stepn { font-size: 26px; font-weight: 900; text-align: center; color: var(--muted); }
  .ed .note { font-size: 17px; color: var(--muted); margin-top: 4px; }
  .ed .err { color: var(--bad); font-size: 21px; font-weight: 800; min-height: 30px; margin: 10px 0; text-align: center; }

  /* ---------- GAME ---------- */
  /* Doskada barmoq ozgina siljisa ham brauzer "sudrash" deb bosishni bekor qilmasligi uchun */
  #game { flex-direction: column; touch-action: none; }
  .topbar { flex: none; height: 76px; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: var(--ink); color: #fff; }
  .topbar .t { font-size: 28px; font-weight: 800; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .clock { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; background: rgba(255,255,255,.12); padding: 4px 18px; border-radius: 14px; }
  .tb { min-height: 60px; min-width: 60px; padding: 0 18px; border-radius: 16px; border: 2px solid rgba(255,255,255,.35); background: transparent; color: #fff; font-size: 21px; font-weight: 700; }
  .tb.end { background: var(--bad); border-color: var(--bad); }
  .lanes { flex: 1; display: grid; gap: 10px; padding: 10px; min-height: 0; }
  .lane { --c: #2b6cb0; position: relative; display: flex; flex-direction: column; background: var(--card); border-radius: calc(22px * var(--s)); border: calc(5px * var(--s)) solid var(--c); overflow: hidden; min-height: 0; }
  .lane-h { flex: none; background: var(--c); color: #fff; padding: calc(10px * var(--s)) calc(16px * var(--s)); }
  .lane-h .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .lane-h .nm { font-size: calc(28px * var(--s)); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lane-h .pl { font-size: calc(22px * var(--s)); font-weight: 700; background: rgba(255,255,255,.22); border-radius: 999px; padding: calc(4px * var(--s)) calc(14px * var(--s)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62%; }
  .bar { margin-top: calc(8px * var(--s)); height: calc(14px * var(--s)); background: rgba(255,255,255,.3); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 999px; transition: width .4s; }
  .lane-b { flex: 1; display: flex; flex-direction: column; padding: calc(14px * var(--s)); gap: calc(12px * var(--s)); min-height: 0; }
  .tag { align-self: flex-start; font-size: calc(17px * var(--s)); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--c); background: color-mix(in srgb, var(--c) 12%, white); border-radius: 999px; padding: calc(4px * var(--s)) calc(14px * var(--s)); }
  .q { font-size: calc(27px * var(--s)); font-weight: 700; line-height: 1.3; }
  .opts { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: calc(10px * var(--s)); min-height: 0; }
  .opts.one { grid-template-columns: 1fr; }
  .opt { min-height: calc(76px * var(--s)); border-radius: calc(18px * var(--s)); border: calc(3px * var(--s)) solid var(--line); background: #f6f8fc; font-size: calc(23px * var(--s)); font-weight: 700; padding: calc(8px * var(--s)) calc(12px * var(--s)); line-height: 1.25; display: flex; align-items: center; justify-content: center; text-align: center; transition: transform .08s; position: relative; }
  .opt:active { transform: scale(.97); }
  .opt.cmd { font-family: Consolas, "Courier New", monospace; }
  .opt.no { background: #fde8e8; border-color: var(--bad); color: #a33; opacity: .55; pointer-events: none; text-decoration: line-through; }
  .opt.yes { background: #e3f6eb; border-color: var(--ok); color: #126b39; }
  .opt.tf-t { background: #e3f6eb; border-color: #9fd8b6; font-size: calc(32px * var(--s)); }
  .opt.tf-f { background: #fde8e8; border-color: #f0b0b0; font-size: calc(32px * var(--s)); }
  .opt.done { background: var(--c); border-color: var(--c); color: #fff; pointer-events: none; }
  .opt .n { position: absolute; top: calc(6px * var(--s)); left: calc(10px * var(--s)); font-family: "Segoe UI", sans-serif; font-size: calc(18px * var(--s)); font-weight: 800; background: rgba(255,255,255,.25); border-radius: 999px; padding: 0 calc(8px * var(--s)); }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: calc(16px * var(--s)); }
  .center .msg { font-size: calc(34px * var(--s)); font-weight: 800; }
  .center .sub { font-size: calc(22px * var(--s)); color: var(--muted); font-weight: 600; }
  .pass { min-height: calc(110px * var(--s)); width: 90%; border: none; border-radius: calc(24px * var(--s)); background: var(--c); color: #fff; font-size: calc(32px * var(--s)); font-weight: 800; box-shadow: 0 calc(6px * var(--s)) 0 rgba(0,0,0,.25); animation: pulse 1.4s infinite; }
  .pass:active { transform: translateY(3px); }
  @keyframes pulse { 50% { transform: scale(1.03); } }
  .medal { font-size: calc(110px * var(--s)); line-height: 1; }
  .place { font-size: calc(48px * var(--s)); font-weight: 900; color: var(--c); }
  .lock { position: absolute; inset: 0; background: rgba(214,69,69,.88); color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; z-index: 5; }
  .lock.on { display: flex; }
  .lock .lt { font-size: calc(34px * var(--s)); font-weight: 800; }
  .lock .cd { font-size: calc(120px * var(--s)); font-weight: 900; line-height: 1; }
  .flash { position: absolute; inset: 0; background: rgba(31,157,85,.9); color: #fff; display: none; align-items: center; justify-content: center; font-size: calc(54px * var(--s)); font-weight: 900; z-index: 5; }
  .flash.on { display: flex; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }

  /* overlays */
  .ov { position: fixed; inset: 0; background: rgba(20,33,61,.72); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .ov.on { display: flex; }
  .box { background: var(--card); border-radius: 28px; padding: 36px 44px; width: min(1000px, 100%); max-height: 100%; overflow-y: auto; text-align: center; }
  .box h2 { margin: 0 0 20px; font-size: 44px; }
  .box p { font-size: 28px; margin: 0 0 26px; }
  .btns { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .btn2 { min-height: 88px; min-width: 220px; padding: 0 36px; border-radius: 22px; border: none; font-size: 30px; font-weight: 800; background: #e6ebf3; }
  .btn2.pri { background: var(--accent); color: #fff; }
  .btn2.red { background: var(--bad); color: #fff; }
  #countdown .num { font-size: 260px; font-weight: 900; color: #fff; line-height: 1; text-shadow: 0 8px 30px rgba(0,0,0,.3); text-align: center; }
  #countdown .lbl { font-size: 48px; font-weight: 800; color: #fff; text-align: center; }
  table.res { width: 100%; border-collapse: collapse; margin: 0 0 28px; font-size: 26px; }
  table.res th { text-align: left; color: var(--muted); font-size: 20px; padding: 10px 14px; border-bottom: 3px solid var(--line); }
  table.res td { padding: 14px; border-bottom: 2px solid var(--line); font-weight: 700; text-align: left; }
  table.res td.pl { font-size: 34px; width: 90px; }
  .sw { display: inline-block; width: 22px; height: 22px; border-radius: 6px; margin-right: 10px; vertical-align: -3px; }
  #banner { position: fixed; left: 50%; top: 90px; transform: translateX(-50%) translateY(-200%); background: #ffd23f; color: var(--ink); font-size: 34px; font-weight: 900; padding: 16px 40px; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 40; transition: transform .5s, opacity .5s; white-space: nowrap; opacity: 0; visibility: hidden; }
  #banner.on { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }
  #toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 24px; font-weight: 800; padding: 16px 30px; border-radius: 18px; z-index: 70; opacity: 0; visibility: hidden; transition: opacity .3s; }
  #toast.on { opacity: 1; visibility: visible; }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

  @media (max-width: 1000px) {
    .grid2, .students, .ed .row2 { grid-template-columns: 1fr; }
    .brand h1 { font-size: 34px; }
    .panel { padding: 24px; }
  }
</style>
</head>
<body>

<!-- ================= SOZLAMALAR ================= -->
<section id="settings" class="screen on">
  <div class="panel">
    <div class="brand">
      <h1 id="tTitle"></h1>
      <div class="seg" id="langSeg">
        <button data-lang="uz">O'zbekcha</button>
        <button data-lang="kk">Қарақалпақша</button>
      </div>
    </div>
    <div class="grid2">
      <div class="field"><div class="lbl" id="tTeams"></div>
        <div class="stepper" data-key="teams"><button data-d="-1">−</button><div class="val"></div><button data-d="1">+</button></div></div>
      <div class="field"><div class="lbl" id="tTpp"></div>
        <div class="stepper" data-key="tpp"><button data-d="-1">−</button><div class="val"></div><button data-d="1">+</button></div></div>
      <div class="field"><div class="lbl" id="tPlayers"></div>
        <div class="stepper" data-key="players"><button data-d="-1">−</button><div class="val"></div><button data-d="1">+</button></div>
        <div class="hint" id="tPlayersHint"></div></div>
      <div class="field"><div class="lbl" id="tSound"></div>
        <div class="seg" id="soundSeg" style="width:100%"><button data-snd="1" style="flex:1"></button><button data-snd="0" style="flex:1"></button></div></div>
      <div class="field" style="grid-column:1/-1">
        <div class="lbl" id="tStudents"></div>
        <div class="students">
          <div>
            <textarea id="stuText" spellcheck="false"></textarea>
            <div class="srow">
              <button class="btn3 pri" id="stuSplit"></button>
              <button class="btn3 red" id="stuClear"></button>
              <span class="scount" id="stuCount"></span>
            </div>
          </div>
          <div class="tcards" id="tcards"></div>
        </div>
      </div>
    </div>
    <div class="rules"><b id="tRules"></b><ol id="rulesList"></ol></div>
    <div class="foot">
      <button class="btn3" id="toAdmin"></button>
      <div class="total" id="tTotal"></div>
      <button class="big" id="startBtn"></button>
    </div>
  </div>
</section>

<!-- ================= ADMIN PANEL ================= -->
<section id="admin" class="screen">
  <div class="panel">
    <div class="atop">
      <h1 id="aTitle"></h1>
      <button class="btn3" id="aBack"></button>
      <button class="btn3 pri" id="aAdd"></button>
    </div>
    <div class="filters" id="aFilters"></div>
    <div class="qlist" id="aList"></div>
    <div class="foot">
      <div class="total" id="aCount"></div>
      <div class="srow" style="margin:0">
        <button class="btn3" id="aExport"></button>
        <button class="btn3" id="aImport"></button>
        <button class="btn3 red" id="aReset"></button>
      </div>
    </div>
    <input type="file" id="aFile" accept=".json,application/json" style="display:none">
  </div>
</section>

<!-- ================= O'YIN ================= -->
<section id="game" class="screen">
  <div class="topbar">
    <div class="t" id="gTitle"></div>
    <div class="clock" id="clock">00:00</div>
    <button class="tb" id="gLang"></button>
    <button class="tb" id="gFull">⛶</button>
    <button class="tb end" id="gEnd"></button>
  </div>
  <div class="lanes" id="lanes"></div>
</section>

<div id="banner"></div>
<div id="toast"></div>

<div class="ov" id="countdown"><div><div class="lbl" id="cdLbl"></div><div class="num" id="cdNum">3</div></div></div>

<div class="ov" id="confirm"><div class="box">
  <h2 id="cfTitle"></h2><p id="cfText"></p>
  <div class="btns"><button class="btn2" id="cfNo"></button><button class="btn2 red" id="cfYes"></button></div>
</div></div>

<div class="ov" id="editor"><div class="box ed">
  <h2 id="edTitle"></h2>
  <label class="l" id="edTypeL"></label>
  <select id="edType"></select>
  <div class="row2">
    <div><label class="l" id="edQuzL"></label><input type="text" id="edQuz"></div>
    <div><label class="l" id="edQkkL"></label><input type="text" id="edQkk"></div>
  </div>
  <div class="note" id="edNote"></div>
  <label class="l" id="edAnsL"></label>
  <div id="edAns"></div>
  <div class="err" id="edErr"></div>
  <div class="btns"><button class="btn2" id="edCancel"></button><button class="btn2 pri" id="edSave"></button></div>
</div></div>

<div class="ov" id="results"><div class="box">
  <h2 id="rsTitle"></h2>
  <table class="res"><thead><tr id="rsHead"></tr></thead><tbody id="rsBody"></tbody></table>
  <div class="btns"><button class="btn2" id="rsSettings"></button><button class="btn2 pri" id="rsAgain"></button></div>
</div></div>

<canvas id="fx"></canvas>

<script>
/* =========================================================
   INTERFEYS MATNLARI
   ========================================================= */
const T = {
  uz: {
    title: 'Git va GitHub <span>poygasi</span>', titlePlain: 'Git va GitHub poygasi',
    teams: 'Jamoalar soni', players: "Har bir jamoadagi o'yinchilar", tpp: "Har bir o'yinchiga topshiriq",
    playersAuto: "O'quvchilar ismlari kiritilgani uchun bu son avtomatik hisoblanadi.",
    sound: 'Ovoz', on: 'Yoqilgan', off: "O'chirilgan", team: n => n + '-jamoa',
    students: "O'quvchilar (har bir ismni yangi qatorga yozing)", stuPh: 'Aziz\nMalika\nJasur\nDilnoza\n…',
    split: '🎲 Jamoalarga taqsimlash', resplit: '🔀 Qayta aralashtirish', clear: 'Tozalash',
    stuCount: n => `${n} ta o'quvchi`, noMembers: "Ismlar kiritilmagan — o'yinchilar raqam bilan ko'rsatiladi",

function load(key, fallback) { try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? fallback : v; } catch (e) { return fallback; } }
function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

const S = Object.assign({ lang: 'kk', teams: 2, players: 4, tpp: 1, names: [], sound: true, students: '', roster: null }, load('gitRaceSettings', {}));
const LIM = { teams: [2, 6], players: [1, 10], tpp: [1, 3] };

const clone = o => JSON.parse(JSON.stringify(o));

const $ = id => document.getElementById(id);

// Matn: oddiy satr yoki {uz, kk}. Qoraqalpoqcha bo'sh bo'lsa, o'zbekchasi olinadi
const L = x => (typeof x === 'string' ? x : (x[S.lang] || x.uz || x.kk || ''));
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const rosterOn = () => Array.isArray(S.roster) && S.roster.length === S.teams && S.roster.every(r => r.length);
const playersPerTeam = () => (rosterOn() ? Math.max(...S.roster.map(r => r.length)) : S.players);

   ========================================================= */
let AC = null;
function beep(ok) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [220, 160];
    notes.forEach((f, k) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = ok ? 'triangle' : 'sawtooth'; o.frequency.value = f;
      const t0 = AC.currentTime + k * 0.12;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
      o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + 0.2);
    });
  } catch (e) {}
}

  document.querySelectorAll('#langSeg button').forEach(b => b.classList.toggle('sel', b.dataset.lang === S.lang));

    mem.innerHTML = auto ? S.roster[i].map(s => `<span class="chip">${esc(s)}</span>`).join('') : `<span class="empty">${t.noMembers}</span>`;
    card.append(inp, mem); box.appendChild(card);
  }
}

function splitStudents(silent) {
  const names = studentList();
  if (names.length < S.teams) { if (!silent) toast(tr().needNames(S.teams)); S.roster = null; save(); renderSettings(); return; }
  const roster = Array.from({ length: S.teams }, () => []);
  shuffle(names).forEach((s, k) => roster[k % S.teams].push(s));
  S.roster = shuffle(roster);
  save(); renderSettings();
  if (!silent) toast(tr().splitDone);
}

document.querySelectorAll('.stepper').forEach(st => st.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const k = st.dataset.key, [mn, mx] = LIM[k];
  S[k] = Math.min(mx, Math.max(mn, S[k] + Number(b.dataset.d)));
  if (k === 'teams' && S.roster) { splitStudents(true); return; }
  save(); renderSettings();
}));
$('langSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.lang = b.dataset.lang; save(); renderSettings(); } });
$('soundSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.sound = b.dataset.snd === '1'; save(); renderSettings(); } });
$('stuText').addEventListener('input', e => {

$('aFile').addEventListener('change', e => {

  rd.onload = () => {
    try {

      const ok = Array.isArray(data) && data.length && data.every(validTask);
      if (!ok) throw new Error('bad');
      BANK = data; saveBank(); renderAdmin(); toast(tr().imported(data.length));
    } catch (err) { toast(tr().badFile); }

});
function validTask(q) {
  if (!q || !TYPES.includes(q.t) || !q.q || !L(q.q)) return false;
  if (q.t === 'tf') return typeof q.c === 'boolean';
  if (!Array.isArray(q.a)) return false;
  if (q.t === 'ord') return q.a.length >= 3;
  return q.a.length >= 2 && Number.isInteger(q.c) && q.c >= 0 && q.c < q.a.length;
}

/* --- tahrirlash oynasi --- */
let edIndex = -1, edState = null;
function blankAns(n) { return Array.from({ length: n }, () => ({ uz: '', kk: '' })); }
function toPair(x) { return typeof x === 'string' ? { uz: x, kk: '' } : { uz: x.uz || '', kk: x.kk || '' }; }
function openEditor(i) {
  edIndex = i;
  const src = i >= 0 ? clone(BANK[i]) : { t: 'mc', q: { uz: '', kk: '' }, c: 0, a: blankAns(4) };
  edState = { t: src.t, q: toPair(src.q), c: src.c, a: (src.a || []).map(toPair) };
  fillEditor();
  $('editor').classList.add('on');
}
function normalizeAnswers() {
  const want = edState.t === 'ord' ? 5 : edState.t === 'tf' ? 0 : 4;
  const a = edState.a.slice(0, want);
  while (a.length < want) a.push({ uz: '', kk: '' });
  edState.a = a;
  if (edState.t === 'tf' && typeof edState.c !== 'boolean') edState.c = true;
  if ((edState.t === 'mc' || edState.t === 'cmd') && !Number.isInteger(edState.c)) edState.c = 0;
}
function fillEditor() {
  const t = tr();
  normalizeAnswers();
  $('edTitle').textContent = edIndex >= 0 ? t.editTask : t.newTask;
  $('edTypeL').textContent = t.type;
  $('edType').innerHTML = TYPES.map(k => `<option value="${k}" ${k === edState.t ? 'selected' : ''}>${t.typeLong[k]}</option>`).join('');
  $('edQuzL').textContent = t.qUz; $('edQkkL').textContent = t.qKk; $('edNote').textContent = t.kkNote;
  $('edQuz').value = edState.q.uz; $('edQkk').value = edState.q.kk;
  $('edSave').textContent = t.save; $('edCancel').textContent = t.cancel; $('edErr').textContent = '';
  const box = $('edAns');
  if (edState.t === 'tf') {
    $('edAnsL').textContent = t.tfL;
    box.innerHTML = `<div class="seg" style="width:100%"><button data-tf="1" style="flex:1" class="${edState.c ? 'sel' : ''}">✓ ${t.yes}</button><button data-tf="0" style="flex:1" class="${!edState.c ? 'sel' : ''}">✗ ${t.no}</button></div>`;
    return;
  }
  const isOrd = edState.t === 'ord';
  $('edAnsL').textContent = isOrd ? t.stepsL : t.ansL;
  box.innerHTML = edState.a.map((a, k) => `
    <div class="ans${isOrd ? ' o' : ''}">
      ${isOrd ? `<div class="stepn">${k + 1}</div>` : `<button class="rad${edState.c === k ? ' sel' : ''}" data-c="${k}">✓</button>`}
      <input type="text" data-k="${k}" data-l="uz" value="${esc(a.uz)}" placeholder="${t.ansUz}">
      <input type="text" data-k="${k}" data-l="kk" value="${esc(a.kk)}" placeholder="${t.ansKk}">
    </div>`).join('');
}
$('edType').addEventListener('change', e => { readEditorInputs(); edState.t = e.target.value; fillEditor(); });
$('edAns').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  readEditorInputs();
  if (b.dataset.tf != null) edState.c = b.dataset.tf === '1';
  if (b.dataset.c != null) edState.c = Number(b.dataset.c);
  fillEditor();
});
function readEditorInputs() {
  edState.q = { uz: $('edQuz').value.trim(), kk: $('edQkk').value.trim() };
  document.querySelectorAll('#edAns input').forEach(inp => { edState.a[Number(inp.dataset.k)][inp.dataset.l] = inp.value.trim(); });
}
$('edCancel').addEventListener('click', () => $('editor').classList.remove('on'));
$('edSave').addEventListener('click', () => {
  const t = tr();
  readEditorInputs();
  const err = m => { $('edErr').textContent = m; };
  const q = { uz: edState.q.uz || edState.q.kk, kk: edState.q.kk };
  if (!q.uz) return err(t.errQ);
  let task;
  if (edState.t === 'tf') task = { t: 'tf', q, c: !!edState.c };
  else {
    // bo'sh qatorlarni olib tashlaymiz, to'g'ri javob raqamini ham shunga moslaymiz
    const filled = edState.a.map((a, k) => ({ a: { uz: a.uz || a.kk, kk: a.kk }, k })).filter(o => o.a.uz);
    if (edState.t === 'ord') {
      if (filled.length < 3) return err(t.errS);
      task = { t: 'ord', q, a: filled.map(o => o.a) };
    } else {
      if (filled.length < 2) return err(t.errA);
      const c = filled.findIndex(o => o.k === edState.c);
      if (c < 0) return err(t.errC);
      task = { t: edState.t, q, c, a: filled.map(o => o.a) };
    }
  }
  if (edIndex >= 0) BANK[edIndex] = task; else BANK.push(task);
  saveBank();
  $('editor').classList.remove('on');
  if (edIndex < 0) adminFilter = 'all';
  renderAdmin(); toast(t.saved);
  if (edIndex < 0) $('admin').scrollTop = $('admin').scrollHeight;
});

   O'YIN
   ========================================================= */
let G = null;

function buildTasks(n) {
  // Har bir jamoaga savollar alohida aralashtiriladi; bank tugasa, qayta aralashtiriladi
  const out = []; let pool = [];
  while (out.length < n) {
    if (!pool.length) pool = shuffle(BANK);
    out.push(prepTask(pool.pop()));
  }
  return out;
}
function prepTask(q) {
  const task = { q, wrongSet: new Set() };
  if (q.t === 'ord') { task.order = shuffle(q.a.map((_, i) => i)); task.step = 0; }
  else if (q.t !== 'tf') task.order = shuffle(q.a.map((_, i) => i));
  return task;
}

function startGame() {
  save();
  const total = playersPerTeam() * S.tpp;
  const roster = rosterOn() ? S.roster : null;
  G = {
    total, start: 0, running: false, finished: 0, ended: false,
    lanes: Array.from({ length: S.teams }, (_, i) => ({
      i, color: COLORS[i], members: roster ? roster[i] : null, tasks: buildTasks(total), idx: 0, phase: 'task',
      mistakes: 0, lockUntil: 0, finishMs: null, place: null
    }))
  };
  show('game');
  buildLanes();
  countdown();
}

// Navbatdagi o'yinchi: ism (agar kiritilgan bo'lsa) yoki raqam.
// O'quvchisi kamroq jamoada ro'yxat boshidan qayta aylanadi
function whoAt(ln, idx) {
  const p = Math.floor(Math.min(idx, G.total - 1) / S.tpp);
  return ln.members ? ln.members[p % ln.members.length] : tr().player(p + 1);
}

function layout() {
  const n = S.teams;
  const cols = n <= 3 ? n : n === 4 ? 2 : 3;
  const rows = Math.ceil(n / cols);
  const lanes = $('lanes');
  lanes.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  lanes.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  const w = (innerWidth - 20) / cols, h = (innerHeight - 96) / rows;
  const s = Math.max(0.62, Math.min(1.5, Math.min(w / 600, h / 560)));
  lanes.style.setProperty('--s', s.toFixed(3));
}
addEventListener('resize', () => { if (G) layout(); });

function buildLanes() {
  const t = tr();
  $('gTitle').textContent = t.titlePlain;
  $('gEnd').textContent = t.end;
  $('gLang').textContent = t.lang;
  const box = $('lanes'); box.innerHTML = '';
  G.lanes.forEach(ln => {
    const el = document.createElement('div');
    el.className = 'lane'; el.style.setProperty('--c', ln.color); el.id = 'lane' + ln.i;
    el.innerHTML = `
      <div class="lane-h"><div class="row"><div class="nm">${esc(teamName(ln.i))}</div><div class="pl"></div></div><div class="bar"><i></i></div></div>
      <div class="lane-b"></div>
      <div class="lock"><div class="lt"></div><div class="cd">3</div></div>
      <div class="flash"></div>`;
    // Javob barmoq/sichqoncha tekkan zahoti qabul qilinadi (click kutilmaydi).
    // click faqat klaviatura bilan bosilganda (e.detail === 0) ishlatiladi.
    el.addEventListener('pointerdown', e => { if (e.button === 0) onLaneClick(ln, e); });
    el.addEventListener('click', e => { if (e.detail === 0) onLaneClick(ln, e); });
    box.appendChild(el);
  });
  layout();
  G.lanes.forEach(renderLane);
}

function renderLane(ln) {
  const t = tr(), el = $('lane' + ln.i), body = el.querySelector('.lane-b');
  el.querySelector('.pl').textContent = ln.phase === 'done' ? t.finish : `${whoAt(ln, ln.idx)} · ${Math.min(ln.idx + 1, G.total)}/${G.total}`;
  el.querySelector('.bar i').style.width = (ln.idx / G.total * 100) + '%';
  el.querySelector('.lock .lt').textContent = t.wrong;

  if (ln.phase === 'done') {
    const medal = ['🥇', '🥈', '🥉'][ln.place - 1] || '🏁';
    body.innerHTML = `<div class="center"><div class="medal">${medal}</div><div class="place">${t.place(ln.place)}</div><div class="sub">${fmt(ln.finishMs)}</div></div>`;
    return;
  }
  if (ln.phase === 'pass') {
    body.innerHTML = `<div class="center"><div class="msg">${t.passMsg}</div><div class="sub">${t.passSub}</div><button class="pass" data-act="next">${esc(t.passBtn(whoAt(ln, ln.idx)))}</button></div>`;
    return;
  }
  const task = ln.tasks[ln.idx], q = task.q;
  let html = `<div class="tag">${t.types[q.t]}</div><div class="q">${esc(L(q.q))}</div>`;
  if (q.t === 'tf') {
    const no = v => task.wrongSet.has(v) ? ' no' : '';
    html += `<div class="opts"><button class="opt tf-t${no(1)}" data-v="1">✓ ${t.yes}</button><button class="opt tf-f${no(0)}" data-v="0">✗ ${t.no}</button></div>`;
  } else if (q.t === 'ord') {
    html += `<div class="opts">` + task.order.map(k => {
      const pos = k < task.step ? k + 1 : 0;
      return `<button class="opt${L(q.a[k]).startsWith('git') ? ' cmd' : ''}${pos ? ' done' : ''}" data-k="${k}">${pos ? `<span class="n">${pos}</span>` : ''}${esc(L(q.a[k]))}</button>`;
    }).join('') + `</div>`;
  } else {
    const isCmd = q.t === 'cmd' || q.a.every(a => L(a).startsWith('git'));
    html += `<div class="opts${isCmd && q.a.some(a => L(a).length > 22) ? ' one' : ''}">` + task.order.map(k =>
      `<button class="opt${isCmd ? ' cmd' : ''}${task.wrongSet.has(k) ? ' no' : ''}" data-k="${k}">${esc(L(q.a[k]))}</button>`).join('') + `</div>`;
  }
  body.innerHTML = html;
}

function onLaneClick(ln, e) {
  if (!G.running || G.ended) return;
  const b = e.target.closest('button'); if (!b) return;
  if (Date.now() < ln.lockUntil) return;
  if (b.dataset.act === 'next' && ln.phase === 'pass') { ln.phase = 'task'; renderLane(ln); return; }
  if (ln.phase !== 'task') return;
  const task = ln.tasks[ln.idx], q = task.q;

  if (q.t === 'tf') {
    const v = b.dataset.v === '1';
    if (v === q.c) return correct(ln, b);
    task.wrongSet.add(v ? 1 : 0); return wrong(ln);
  }
  const k = Number(b.dataset.k);
  if (q.t === 'ord') {
    if (k === task.step) {
      task.step++;
      if (task.step === q.a.length) return correct(ln, null);
      beep(true); renderLane(ln); return;
    }
    task.step = 0; return wrong(ln);
  }
  if (k === q.c) return correct(ln, b);
  task.wrongSet.add(k); wrong(ln);
}

function correct(ln, btn) {
  beep(true);
  if (btn) btn.classList.add('yes');
  const el = $('lane' + ln.i), fl = el.querySelector('.flash');
  fl.textContent = tr().correct; fl.classList.add('on');
  ln.lockUntil = Date.now() + 700;
  setTimeout(() => {
    fl.classList.remove('on');
    if (!G || G.ended) return;
    ln.idx++;
    if (ln.idx >= G.total) {
      ln.phase = 'done'; ln.finishMs = Date.now() - G.start; ln.place = ++G.finished;
      if (ln.place === 1) { showBanner(tr().winner(teamName(ln.i))); confetti(); }
      if (G.finished === G.lanes.length) setTimeout(showResults, 1600);
    } else if (ln.idx % S.tpp === 0) ln.phase = 'pass';
    renderLane(ln);
  }, 700);
}

function wrong(ln) {
  beep(false);
  ln.mistakes++;
  ln.lockUntil = Date.now() + 3000;
  const el = $('lane' + ln.i);
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  renderLane(ln);
  el.querySelector('.lock').classList.add('on');
}

function fmt(ms) { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
setInterval(() => {
  if (!G || !G.running || G.ended) return;
  $('clock').textContent = fmt(Date.now() - G.start);
  const now = Date.now();
  G.lanes.forEach(ln => {
    const lk = $('lane' + ln.i).querySelector('.lock');
    if (!lk.classList.contains('on')) return;
    const left = Math.ceil((ln.lockUntil - now) / 1000);
    if (left <= 0) lk.classList.remove('on'); else lk.querySelector('.cd').textContent = left;
  });
}, 150);

function countdown() {
  const ov = $('countdown'); ov.classList.add('on');
  $('cdLbl').textContent = tr().ready;
  $('clock').textContent = '00:00';
  let n = 3; $('cdNum').textContent = n; beep(true);
  const iv = setInterval(() => {
    n--;
    if (n > 0) { $('cdNum').textContent = n; beep(true); return; }
    clearInterval(iv);
    $('cdNum').textContent = '▶'; $('cdLbl').textContent = tr().go;
    setTimeout(() => { ov.classList.remove('on'); G.start = Date.now(); G.running = true; }, 500);
  }, 900);
}

$('gLang').addEventListener('click', () => {
  S.lang = S.lang === 'kk' ? 'uz' : 'kk'; save();
  const t = tr();
  $('gTitle').textContent = t.titlePlain; $('gEnd').textContent = t.end; $('gLang').textContent = t.lang;
  G.lanes.forEach(ln => { $('lane' + ln.i).querySelector('.nm').textContent = teamName(ln.i); renderLane(ln); });
});
$('gFull').addEventListener('click', () => {
  try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) {}
});
$('gEnd').addEventListener('click', () => { const t = tr(); ask(t.cfTitle, t.cfText, t.cfYes, showResults); });

function showBanner(text) {
  const b = $('banner'); b.textContent = text; b.classList.add('on');
  setTimeout(() => b.classList.remove('on'), 4000);
}

function showResults() {
  if (!G || G.ended) return;
  G.ended = true;
  const t = tr();
  $('rsTitle').textContent = '🏆 ' + t.results;
  $('rsHead').innerHTML = t.cols.map(c => `<th>${c}</th>`).join('');
  const rows = G.lanes.slice().sort((a, b) => (a.place || 99) - (b.place || 99) || b.idx - a.idx || a.mistakes - b.mistakes);
  $('rsBody').innerHTML = rows.map(ln => {
    const medal = ln.place ? (['🥇', '🥈', '🥉'][ln.place - 1] || ln.place) : '—';
    return `<tr><td class="pl">${medal}</td><td><span class="sw" style="background:${ln.color}"></span>${esc(teamName(ln.i))}</td><td>${ln.finishMs != null ? fmt(ln.finishMs) : '—'}</td><td>${ln.mistakes}</td><td>${ln.idx}/${G.total}</td></tr>`;
  }).join('');
  $('rsSettings').textContent = t.toSettings; $('rsAgain').textContent = t.again;
  $('results').classList.add('on');
  if (G.finished) confetti();
}
$('rsAgain').addEventListener('click', () => { $('results').classList.remove('on'); startGame(); });
$('rsSettings').addEventListener('click', () => {
  $('results').classList.remove('on'); G = null; show('settings'); renderSettings();
});

function confetti() {
  const cv = $('fx'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const ps = Array.from({ length: 220 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5,
    vx: (Math.random() - 0.5) * 4, vy: 3 + Math.random() * 5, r: 6 + Math.random() * 8,
    a: Math.random() * Math.PI, va: (Math.random() - 0.5) * 0.3, c: COLORS[Math.floor(Math.random() * COLORS.length)]
  }));
  const t0 = performance.now();
  (function frame(now) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
    });
    if (now - t0 < 4500) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(t0);
}

renderSettings();
</script>
</body>
</html>
